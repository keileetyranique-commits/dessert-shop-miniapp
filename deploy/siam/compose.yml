name: siam-shop-baseline
services:
  shop:
    build:
      context: ../..
      dockerfile: deploy/siam/Dockerfile
    ports: ['127.0.0.1:18081:8080']
    environment:
      SIAM_BASELINE_FIXTURES: '1'
      NODE_ENV: development
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [baseline]
networks:
  baseline:
