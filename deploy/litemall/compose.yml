name: litemall-upstream-baseline
services:
  mysql:
    image: mirror.gcr.io/library/mysql:8.0.40
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Run setup.mjs}
      MYSQL_DATABASE: litemall_baseline
      MYSQL_USER: litemall
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Run setup.mjs}
    volumes:
      - mysql_data:/var/lib/mysql
      - ../../vendor/litemall/litemall-db/sql/litemall_table.sql:/docker-entrypoint-initdb.d/01-table.sql:ro
      - ../../vendor/litemall/litemall-db/sql/litemall_data.sql:/docker-entrypoint-initdb.d/02-data.sql:ro
    healthcheck:
      test:
        [
          CMD-SHELL,
          'MYSQL_PWD="$$MYSQL_PASSWORD" mysql -u litemall litemall_baseline -e "SELECT COUNT(*) FROM litemall_admin" >/dev/null',
        ]
      interval: 5s
      timeout: 5s
      retries: 60
    networks: [baseline]
  initialize:
    build:
      context: ../..
      dockerfile: deploy/litemall/Dockerfile
    image: litemall-upstream-baseline:local
    env_file: .env
    command: [java, -cp, '.:BOOT-INF/classes:BOOT-INF/lib/*', BaselineAdmin]
    depends_on:
      mysql: { condition: service_healthy }
    networks: [baseline]
  app:
    image: litemall-upstream-baseline:local
    env_file: .env
    volumes: [media_data:/app/storage]
    depends_on:
      initialize: { condition: service_completed_successfully }
    networks: [baseline]
  web:
    image: mirror.gcr.io/library/nginx:1.28-alpine
    ports: ['127.0.0.1:${BASELINE_PORT:-18080}:8080']
    volumes: ['./nginx.conf:/etc/nginx/conf.d/default.conf:ro']
    depends_on: [app]
    networks: [baseline, entry]
networks:
  baseline:
    internal: true
  entry:
volumes:
  mysql_data:
  media_data:
