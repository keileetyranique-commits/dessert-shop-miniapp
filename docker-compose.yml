name: store-platform-dev
x-app: &app
  build: .
  image: store-platform-dev:local
  init: true
  env_file: .env
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 3s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
    command:
      [
        sh,
        -c,
        'exec redis-server --requirepass "$$REDIS_PASSWORD" --appendonly yes',
      ]
    volumes: [redis_data:/data]
    healthcheck:
      test:
        [
          CMD-SHELL,
          'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG',
        ]
      interval: 3s
      timeout: 3s
      retries: 30
  migrate:
    <<: *app
    command: [pnpm, db:migrate]
    depends_on:
      postgres: { condition: service_healthy }
  api:
    <<: *app
    command: [pnpm, --filter, '@platform/api', dev]
    environment:
      API_HOST: 0.0.0.0
    ports: ['127.0.0.1:3000:3000']
    volumes: ['./apps/api/src:/workspace/apps/api/src']
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3000/api/v1/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
  admin:
    <<: *app
    env_file: []
    command: [pnpm, --filter, '@platform/admin-web', dev]
    environment:
      API_PROXY_TARGET: http://api:3000
    ports: ['127.0.0.1:5173:5173']
    volumes: ['./apps/admin-web/src:/workspace/apps/admin-web/src']
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:5173').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
  pos:
    <<: *app
    env_file: []
    command: [pnpm, --filter, '@platform/merchant-pos', dev]
    environment:
      API_PROXY_TARGET: http://api:3000
    ports: ['127.0.0.1:5174:5174']
    volumes: ['./apps/merchant-pos/src:/workspace/apps/merchant-pos/src']
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:5174').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
volumes:
  postgres_data:
  redis_data:
